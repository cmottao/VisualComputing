<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escena 3D interactiva — Brazo robótico</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
      #ayuda {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 10;
        color: #e6edf3;
        background: rgba(16, 20, 26, 0.7);
        border: 1px solid #2f3b46;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 13px;
        line-height: 1.5;
        max-width: 320px;
      }
      #ayuda b { color: #ff8c3a; }
    </style>
  </head>
  <body>
    <div id="ayuda">
      <b>Brazo robótico — automatización</b><br />
      🖱️ Mouse: orbitar / zoom / mover cámara.<br />
      🎚️ Panel derecho: mover cada articulación.<br />
      ⌨️ <b>Espacio</b>: pausar/reanudar animación.<br />
      ⌨️ <b>R</b>: reiniciar la secuencia.
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
